[project]
name = "voice-core"
version = "0.1.0"
description = "Shared voice engine on Gnani Prisma (STT) + Timbre (TTS) + an OpenAI-compatible LLM (Groq / Evon)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "websockets>=13.0",
  "httpx>=0.27",
  "numpy>=2.0",
  "scipy>=1.14",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "openai>=1.55",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_core"]
