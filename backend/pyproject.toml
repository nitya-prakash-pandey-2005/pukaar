[project]
name = "pukaar"
version = "0.1.0"
description = "AI disaster helpline: answers every flood call in the caller's language, triages and maps it. Built on Gnani AI Prisma and Timbre; Evon v3.3-ready through an OpenAI-compatible adapter (the demos run on Groq)."
requires-python = ">=3.12,<3.13"
dependencies = ["voice-core"]

[tool.uv.sources]
voice-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pukaar"]
