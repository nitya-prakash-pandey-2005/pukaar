name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python 3.12, keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # No secrets: every test runs on fakes. Empty keys make sure nothing reaches Gnani or Groq.
      GNANI_API_KEY: ""
      GROQ_API_KEY: ""
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.20"
          python-version: "3.12"
          enable-cache: true
      - name: Install workspace (voice-core + pukaar)
        run: uv sync --all-packages --locked
      - name: Run tests
        run: uv run python -m pytest -q

  frontend:
    name: Frontend build (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (live app)
        run: npm run build
      - name: Build (static demo, as deployed on Vercel)
        run: npm run build:demo
